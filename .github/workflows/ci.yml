name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .npmrc sets ignore-scripts=true (deliberately — it blocks arbitrary
      # postinstall code from the dependency tree). That also suppresses
      # Prisma's own postinstall, so the client has to be generated by hand
      # or every `import { ... } from '@prisma/client'` fails to compile.
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # apps/api and apps/web both import @holiday-vibez/shared, which is
      # consumed as built output rather than source.
      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      # Regression tests for the critical bugs from the Aug-2026 QA audit.
      # See apps/api/src/**/*.spec.ts — each pins a specific defect.
      - name: Run API tests
        run: npm test -w apps/api
